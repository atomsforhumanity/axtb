[package]
name = "axtb-cli"
description = "The axtb command-line program: GFN2-xTB, g-xTB and GFN-FF energies, gradients and Hessians as JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/atomsforhumanity/axtb#readme"
readme = "README.md"
keywords = ["quantum-chemistry", "tight-binding", "xtb", "g-xtb", "cli"]
categories = ["science", "command-line-utilities"]
# the tests read data of the repository; the package is the program
include = ["/src", "/Cargo.toml", "/README.md", "/COPYING", "/COPYING.LESSER", "/NOTICE"]

[[bin]]
name = "axtb"
path = "src/main.rs"
# the library `axtb` documents itself under that name
doc = false

[dependencies]
axtb-driver = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
# exact decimal-to-double parsing of JSON requests (the default parser can be 1 ulp off)
serde_json = { version = "1", features = ["float_roundtrip"] }

# the tests compare the CLI with the Rust APIs
[dev-dependencies]
axtb = { workspace = true }
axtb-gfnff = { workspace = true }
axtb-gxtb = { workspace = true }

[lints]
workspace = true
