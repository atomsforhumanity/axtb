[package]
name = "axtb-py"
description = "Python bindings of axtb (the PyPI package axtb, built with maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# published as wheels on PyPI (pyproject.toml), not on crates.io
publish = false

[lib]
name = "_axtb"
crate-type = ["cdylib"]

[features]
default = ["gxtb"]
# g-xTB (methods "gxtb-v1.1", "gxtb-v2.0.1") from axtb-gxtb; `--no-default-features` builds a
# module without it (GFN2-xTB, GFN-FF).
gxtb = ["axtb-driver/gxtb"]

[dependencies]
axtb = { workspace = true }
# request validation, dispatch to the methods and the response (g-xTB with `gxtb`)
axtb-driver = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"
serde_json = "1"

[lints]
workspace = true
