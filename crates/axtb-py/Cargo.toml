[package]
name = "axtb-py"
description = "Python bindings of axtb (the PyPI package axtb, built with maturin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# GPL-3.0-only as built by default (includes the GPL crate axtb-gxtb, feature `gxtb`);
# LGPL-3.0-or-later with --no-default-features (LICENSE)
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# published as wheels on PyPI (pyproject.toml), not on crates.io
publish = false

[lib]
name = "_axtb"
crate-type = ["cdylib"]

[features]
default = ["gxtb"]
# g-xTB (methods "gxtb-v1.1", "gxtb-v2.0.1") from the GPL-3.0 crate axtb-gxtb; a build with it is
# GPL-3.0 as a whole, `--no-default-features` gives an LGPL-only module (GFN2-xTB, GFN-FF).
gxtb = ["axtb-driver/gxtb"]

[dependencies]
axtb = { workspace = true }
# request validation, dispatch to the methods and the response (LGPL code; g-xTB with `gxtb`)
axtb-driver = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"
serde_json = "1"

[lints]
workspace = true
