[package]
name = "axtb-driver"
description = "One request/response layer for the axtb front ends (CLI, Python): validation, dispatch to GFN2-xTB, g-xTB and GFN-FF, Hessians and their vibrational analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axtb-driver"
readme = "README.md"
keywords = ["quantum-chemistry", "tight-binding", "xtb", "g-xtb", "chemistry"]
categories = ["science", "simulation"]
# the tests read data of the repository; the package is the library
include = ["/src", "/Cargo.toml", "/README.md", "/COPYING", "/COPYING.LESSER", "/NOTICE"]

[lib]
name = "axtb_driver"
path = "src/lib.rs"

[dependencies]
axtb = { workspace = true }
# GFN-FF (method "gfnff")
axtb-gfnff = { workspace = true }
# g-xTB (methods "gxtb-v1.1", "gxtb-v2.0.1") and its solvation composite
axtb-gxtb = { workspace = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# exact decimal-to-double parsing of JSON requests (the default parser can be 1 ulp off)
serde_json = { version = "1", features = ["float_roundtrip"] }
# tests/threads.rs disables faer's global parallelism (same version as crates/axtb)
faer = { version = "0.22", default-features = false, features = ["std", "linalg", "rayon"] }

[lints]
workspace = true
