[package]
name = "axtb-base"
description = "Shared foundation of the axtb crates: molecules, errors, units, element tables, the error function, timers and finite differences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axtb-base"
readme = "README.md"
keywords = ["quantum-chemistry", "chemistry", "xtb", "units"]
categories = ["science"]
include = ["/src", "/Cargo.toml", "/README.md", "/COPYING", "/COPYING.LESSER", "/NOTICE"]

[lib]
name = "axtb_base"
path = "src/lib.rs"

[dependencies]
# the parallel loops of the finite differences (`fd`), on the caller's pool
rayon = "1.10"

[lints]
workspace = true
