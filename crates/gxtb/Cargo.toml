[package]
name = "axtb-gxtb"
description = "g-xTB v1.1 (public preprint version) and 2.0.1: single points, gradients and Hessians reproducing the g-xTB 1.1.0 and 2.0.1 programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Embeds the g-xTB 1.1.0 parameter files and tables extracted from the g-xTB 1.1.0 and 2.0.1
# programs, distributed under GPL-3.0 (grimme-lab/g-xtb).
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axtb-gxtb"
readme = "README.md"
keywords = ["g-xtb", "tight-binding", "quantum-chemistry", "chemistry", "xtb"]
categories = ["science", "simulation"]
# the tests read data of the repository; the package is the library with its parameter files
include = ["/src", "/param", "/Cargo.toml", "/README.md", "/COPYING", "/NOTICE"]

[lib]
name = "axtb_gxtb"
path = "src/lib.rs"

[dependencies]
axtb = { workspace = true }
axtb-d4 = { workspace = true }
faer = { version = "0.22", default-features = false, features = ["std", "linalg", "rayon"] }
rayon = "1.10"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
