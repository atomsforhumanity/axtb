# Checks on every push and pull request (Linux x86-64; no reference programs needed), on the
# newest stable Rust: scripts/check.sh fast (rustfmt, clippy and rustdoc with warnings as errors,
# the workspace tests, the LGPL-only build, a wheel with the Python tests in a fresh venv, the
# privacy grep, the license-file copies), then `cargo package` of the crates.io packages.
#
# The privacy grep adds the repository secret AXTB_PRIVATE_PATTERN (a regular expression of the
# site's host names) to its built-in patterns; without the secret (forks, or not set up) that
# part is skipped and the built-in patterns still run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check.sh fast and cargo package (Rust stable)
    runs-on: ubuntu-24.04
    env:
      AXTB_PRIVATE_PATTERN: ${{ secrets.AXTB_PRIVATE_PATTERN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: Swatinem/rust-cache@v2
      - name: scripts/check.sh fast
        run: scripts/check.sh fast
      - name: cargo package (the crates.io packages, in publishing order)
        run: >-
          cargo package -p axtb-d4 -p axtb-solvation -p axtb -p axtb-gfnff -p axtb-gxtb
          -p axtb-driver -p axtb-cli
